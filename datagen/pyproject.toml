[project]
name = "finguard-datagen"
version = "0.1.0"
description = "Builds FinGuard's seeded synthetic world from AMLworld and generated data"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.63.0",
    "finguard",
    "jinja2>=3.1.6",
    "numpy>=2.5.5",
    "openai>=3.60.0",
    "polars>=2.2.0",
    "pypdfium2>=5.15.2",
    "weasyprint>=70.0",
]

[project.scripts]
finguard-datagen = "datagen.cli:main"

[tool.uv.sources]
finguard = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "datagen"

name: Contracts

on:
  push:
    branches: [main]
  pull_request:
    # edited: retargeting a stacked PR changes the base its contracts are compared with.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.9.26" # keep in sync with ci.yml

jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      apicurio:
        image: apicurio/apicurio-registry:3.3.5 # same as deploy/compose
        ports: ["8080:8080"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health/ready"
          --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      FINGUARD_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base's contracts are compared against
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # PyICU builds from source against the system ICU.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev pkg-config
      - run: uv sync --locked
      - name: Contract files match the message models
        run: uv run finguard-contracts check
      - name: Contracts stay backward compatible with the base
        env:
          # A pull request is compared with its base branch, a push to main with the commit before it.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          base_args=()
          if git cat-file -e "$BASE:contracts" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive "$BASE" contracts | tar -x -C "$RUNNER_TEMP/base"
            uv run finguard-contracts --directory "$RUNNER_TEMP/base/contracts" register
            base_args=(--base "$RUNNER_TEMP/base/contracts")
          fi
          uv run finguard-contracts check-compatibility "${base_args[@]}"

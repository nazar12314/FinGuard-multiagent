name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.9.26" # keep in sync with the uv_build range in pyproject.toml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --locked fails when uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - name: Validate the local docker-compose stack
        run: docker compose -f deploy/compose/compose.yaml --profile observability config --quiet
      # Catches config keys that an image bump renames, which compose validation can't see.
      - name: Validate the OpenTelemetry Collector and Prometheus configs
        run: |
          docker run --rm -v "$PWD/deploy/compose/otel-collector/config.yaml:/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.165.0 validate --config=/config.yaml
          docker run --rm -v "$PWD/deploy/compose/prometheus/prometheus.yaml:/prometheus.yaml:ro" \
            --entrypoint promtool prom/prometheus:v3.16.0 check config /prometheus.yaml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit

  integration:
    runs-on: ubuntu-latest # Docker is available here for testcontainers
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/integration

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 300
  batch: {}

exporters:
  # Every span, for system traces in Grafana.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      # base64("pk-lf-finguard-dev:sk-lf-finguard-dev"), the keys seeded by langfuse-web.
      Authorization: Basic cGstbGYtZmluZ3VhcmQtZGV2OnNrLWxmLWZpbmd1YXJkLWRldg==
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # Langfuse also gets every span until LLM calls exist; then only gen_ai spans go there.
      exporters: [otlp_grpc/tempo, otlp_http/langfuse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

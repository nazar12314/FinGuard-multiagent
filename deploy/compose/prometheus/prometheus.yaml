global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  # FinGuard's processes run on the host: the API on its own port, the workers on ops ports.
  - job_name: finguard
    scrape_interval: 5s
    static_configs:
      - targets: [host.docker.internal:8000]
        labels: {process: api}
      - targets: [host.docker.internal:9101]
        labels: {process: outbox-relay}
      - targets: [host.docker.internal:9102]
        labels: {process: ping-consumer}

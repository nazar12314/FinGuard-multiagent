[project]
name = "finguard"
version = "0.1.0"
description = "Multi-agent AML investigation platform for a simulated EU neobank"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.15.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "uuid-utils>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
finguard-api = "finguard.entrypoints.api:main"
finguard-migrate = "finguard.entrypoints.migrate:main"
finguard-outbox-relay = "finguard.entrypoints.outbox_relay:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "hypothesis>=6.170.17",
    "import-linter",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "testcontainers[kafka,postgres]>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "PT", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy".msg = "Infrastructure import: use a port, implement it in adapters/"
"aiokafka".msg = "Infrastructure import: use a port, implement it in adapters/"
"neo4j".msg = "Infrastructure import: use a port, implement it in adapters/"
"langgraph".msg = "Infrastructure import: use a port, implement it in adapters/"
"openai".msg = "Vendor SDK: go through the LlmGateway port"
"anthropic".msg = "Vendor SDK: go through the LlmGateway port"

[tool.ruff.lint.per-file-ignores]
# Only the outer rings may touch infrastructure libraries and vendor SDKs.
"src/finguard/modules/*/adapters/**" = ["TID251"]
"src/finguard/infrastructure/**" = ["TID251"]
"src/finguard/entrypoints/**" = ["TID251"]
"src/finguard/core/**" = ["TID251"]
"tests/integration/**" = ["TID251"]
"tests/e2e/**" = ["TID251"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

# aiokafka ships no type information.
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
